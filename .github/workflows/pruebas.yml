name: Pruebas de dev
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    name: Playwright en Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias verificadas
        run: npm ci --no-audit --no-fund
      - name: Preparar Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Ejecutar los casos de la demo
        run: npx --no-install playwright test pruebas --reporter=list,html
      - name: Adjuntar el informe HTML de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 3
          if-no-files-found: error
